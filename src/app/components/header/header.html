<header class="hd">
  <a routerLink="/" class="hd__brand">
    <span class="hd__ball" aria-hidden="true"></span>
    <span class="hd__name">Padel</span>
  </a>

  <div class="hd__clock">
    <span class="hd__date">{{ date() }}</span>
    <span class="hd__time">{{ time() }}</span>
  </div>

  @if (user(); as u) {
    <div class="hd__user">
      <div class="hd__user-info">
        <span class="hd__user-name">{{ u.name }}</span>
        <span class="hd__user-role">{{ roleLabel() }}</span>
      </div>
      <button type="button" class="hd__logout" (click)="logout()" aria-label="Cerrar sesión">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  }
</header>
